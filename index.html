<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d5a2f" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      These tags carry `data-rh` so react-helmet-async replaces them on mount
      instead of appending a duplicate set. They are the fallback that non-JS
      crawlers see, and they describe the landing page.
    -->
    <!-- seo:start -->
    <title data-rh="true">
      Kawi | Hybrid BRL to USDC Settlement Engine for Latin America
    </title>
    <meta
      data-rh="true"
      name="description"
      content="Kawi runs a hybrid settlement engine: PIX and local fiat rails for access, Solana and USDC for movement, in one programmable, auditable operation."
    />
    <meta data-rh="true" name="author" content="Kawi" />
    <meta
      data-rh="true"
      name="keywords"
      content="BRL to USDC, hybrid settlement engine, programmable settlement, fiat to stablecoin, PIX to USDC, stablecoin settlement Brazil, cross-border payments latam, Kawi"
    />
    <meta
      data-rh="true"
      name="robots"
      content="index, follow, max-image-preview:large"
    />
    <link data-rh="true" rel="canonical" href="https://kawiservices.com" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <meta data-rh="true" property="og:site_name" content="Kawi" />
    <meta data-rh="true" property="og:locale" content="en_US" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta
      data-rh="true"
      property="og:title"
      content="Kawi | Hybrid BRL to USDC Settlement Engine for Latin America"
    />
    <meta
      data-rh="true"
      property="og:description"
      content="A programmable hybrid settlement engine turning local BRL payments into USDC liquidity through fiat and blockchain infrastructure."
    />
    <meta data-rh="true" property="og:url" content="https://kawiservices.com" />
    <meta
      data-rh="true"
      property="og:image"
      content="https://kawiservices.com/logo512.png"
    />

    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:site" content="@KawiServices" />
    <meta
      data-rh="true"
      name="twitter:title"
      content="Kawi | Hybrid BRL to USDC Settlement Engine for Latin America"
    />
    <meta
      data-rh="true"
      name="twitter:description"
      content="A programmable hybrid settlement engine turning local BRL payments into USDC liquidity through fiat and blockchain infrastructure."
    />
    <meta
      data-rh="true"
      name="twitter:image"
      content="https://kawiservices.com/logo512.png"
    />

    <script data-rh="true" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://kawiservices.com/#organization",
        "name": "Kawi",
        "legalName": "Kawi Services",
        "url": "https://kawiservices.com",
        "logo": "https://kawiservices.com/logo512.png",
        "description": "Kawi is a hybrid settlement infrastructure connecting banking rails and blockchain to move value across Latin America quickly, securely and programmatically.",
        "email": "company@kawiservices.com",
        "areaServed": ["BR", "Latin America"],
        "sameAs": [
          "https://x.com/KawiServices",
          "https://www.facebook.com/kawiservicess/",
          "https://www.trustpilot.com/review/kawi.life"
        ]
      }
    </script>
    <!-- seo:end -->
    <style>
      /* The static site nav is a crawlable structural fallback, not UI. */
      .static-sitenav {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <!--
      Static site navigation. It lives outside #root, so React never removes it,
      and it guarantees the primary sections are present as crawlable links in
      the raw HTML of every prerendered page (the visible Navbar/Footer render
      the same links via JS). Clear, persistent site structure is what Google
      draws sitelinks from for a brand query such as "Kawi".
    -->
    <nav aria-label="Kawi site" class="static-sitenav">
      <a href="/">Kawi</a>
      <a href="/about">About Kawi</a>
      <a href="/blog">Kawi Blog</a>
      <a href="/regulation">Regulation</a>
      <a href="/privacy">Privacy</a>
      <a href="/cookies">Cookies Policy</a>
    </nav>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
